<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d8793a"><link rel="manifest" href="./manifest.webmanifest">
<title>名曲じゃんけん秋場所</title>
<style>
:root{--kaki:#d8793a;--kaki2:#b85d2d;--kaki3:#f4d2b7;--paper:#fff8f1;--ink:#633b28}*{box-sizing:border-box}html,body{margin:0;min-height:100%;color:var(--ink);font-family:ui-rounded,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;background:var(--paper)}body{background-image:radial-gradient(circle at 12% 18%,#d8793a18 0 32px,transparent 33px),radial-gradient(circle at 82% 70%,#d8793a12 0 46px,transparent 47px)}header{text-align:center;padding:28px 16px 8px}h1{margin:0;font-size:clamp(30px,7vw,52px);font-weight:400;letter-spacing:.08em;color:var(--kaki2)}header p{margin:5px 0;color:var(--kaki2);font-size:12px}.wrap{max-width:700px;margin:auto;padding:8px 14px 50px}.belt{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:55px calc(50% - 110px) 58px;scrollbar-width:none;perspective:900px;overscroll-behavior-x:contain}.belt::-webkit-scrollbar{display:none}.day{position:relative;flex:0 0 220px;height:250px;scroll-snap-align:center;border:1px solid var(--kaki3);border-radius:30px;background:#fffaf5;padding:20px;transform:scale(.66) rotateY(24deg);opacity:.35;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .4s,box-shadow .4s;transform-origin:center}.day.active{transform:scale(1.08) rotateY(0deg);opacity:1;box-shadow:0 20px 42px #8b4a2828;z-index:3}.day.near{transform:scale(.84) rotateY(14deg);opacity:.65}.day.left{transform:scale(.72) rotateY(28deg);opacity:.42}.day.right{transform:scale(.72) rotateY(-28deg);opacity:.42}.daynum{font-size:11px;color:var(--kaki2);letter-spacing:.12em}.num{font-size:12px;color:#9c6a50;margin-top:5px}.date{font-size:30px;margin:5px 0;color:var(--kaki2)}.theme{font-size:17px;margin-top:12px}.winner{position:absolute;bottom:24px;color:var(--kaki2)}.badge{display:inline-block;margin-top:12px;padding:5px 10px;border-radius:99px;background:var(--kaki3);color:var(--kaki2);font-size:10px}.hint{text-align:center;font-size:11px;color:#a57961;margin-top:-35px}.panel{margin:18px 0 0;border-top:1px solid var(--kaki3);padding:12px 2px}.panel h2{font-size:13px;font-weight:500;margin:0 0 7px;color:var(--kaki2)}.score{display:flex;flex-direction:column;gap:3px}.person{display:grid;grid-template-columns:1fr auto;align-items:center;border-bottom:1px solid #efd9ca;padding:5px 4px;background:transparent}.top{display:contents}.name{font-size:12px}.total{font-size:15px;color:var(--kaki2)}.stars{grid-column:1 / -1;display:flex;gap:0;margin-top:1px}.star{border:0;background:none;color:var(--kaki);font-size:13px;line-height:1;padding:0 2px;cursor:pointer;opacity:.18}.star.on{opacity:1}.panel>.hint{margin-top:8px;font-size:10px}@media(max-width:600px){.belt{padding-left:calc(50% - 105px);padding-right:calc(50% - 105px)}.day{flex-basis:210px;height:235px}}
</style></head>
<body><header><h1>名曲じゃんけん秋場所</h1><p>9.13 — 9.27　十五日間</p></header>
<main class="wrap"><section><div class="belt" id="belt"></div><div class="hint">← めくる →</div></section><section class="panel"><h2>累計 ★</h2><div class="score" id="score"></div><div class="hint">★を押して得点</div></section></main>
<script>
const DAYURL='./data/days.csv',PARTURL='./data/participants.csv',STARURL='./data/stars.csv';let days=[],parts=[],stars=[];let today=new Date('2026-09-15T00:00:00+09:00');
function localDate(s){return new Date(s+'T00:00:00+09:00')}
function csv(t){const lines=t.trim().split(/\r?\n/);const keys=lines.shift().split(',');return lines.map(l=>{const v=l.split(',');return Object.fromEntries(keys.map((k,i)=>[k,v[i]??'']))})}
async function load(){const [d,p,s]=await Promise.all([fetch(DAYURL).then(r=>r.text()),fetch(PARTURL).then(r=>r.text()),fetch(STARURL).then(r=>r.text())]);days=csv(d);parts=csv(p);stars=csv(s).map(x=>({...x,points:+x.points}));render()}
function activeIndex(){return Math.max(0,Math.min(days.length-1,Math.round((today-localDate('2026-09-13'))/86400000)))}
function render(){const belt=document.querySelector('#belt');belt.innerHTML='';days.forEach((d,i)=>{const e=document.createElement('article');e.className='day';e.dataset.i=i;e.innerHTML=`<div class="daynum">DAY ${d.day}</div><div class="num">${d.date.slice(5).replace('-','.')}</div><div class="date">${localDate(d.date).toLocaleDateString('ja-JP',{weekday:'short'})}</div><div class="theme">${d.theme||'テーマ未定'}</div><div class="winner">${d.winner?'★ '+d.winner:'勝者未定'}</div>${i===activeIndex()?'<span class="badge">TODAY</span>':''}`;belt.append(e)});setupBelt();renderScores()}
function setupBelt(){const belt=document.querySelector('#belt');const cards=[...belt.children];const focus=()=>{const mid=belt.scrollLeft+belt.clientWidth/2;let best=0,dist=Infinity;cards.forEach((c,i)=>{const x=c.offsetLeft+c.offsetWidth/2,d=Math.abs(x-mid);if(d<dist){dist=d;best=i}});cards.forEach((c,i)=>{c.classList.toggle('active',i===best);c.classList.toggle('near',Math.abs(i-best)===1);c.classList.toggle('left',i<best-1);c.classList.toggle('right',i>best+1);if(i>=best-1&&i<=best+1)c.classList.remove('left','right')})};belt.addEventListener('scroll',()=>requestAnimationFrame(focus),{passive:true});setTimeout(()=>{cards[activeIndex()]?.scrollIntoView({behavior:'instant',inline:'center'});focus()},30)}
function renderScores(){const box=document.querySelector('#score');box.innerHTML='';const totals=parts.map(p=>{const mine=stars.filter(s=>s.participant_id===p.id&&s.points>0);return {...p,total:mine.reduce((a,s)=>a+s.points,0)}}).sort((a,b)=>b.total-a.total);totals.forEach(p=>{const el=document.createElement('div');el.className='person';const ss=days.map(d=>{const ok=localDate(d.date)>=localDate(p.joined)&&stars.some(s=>s.date===d.date&&s.participant_id===p.id&&s.points>0);return `<button class="star ${ok?'on':''}" data-id="${p.id}" data-date="${d.date}">★</button>`}).join('');el.innerHTML=`<div class="top"><span class="name">${p.name}</span><strong class="total">${p.total}点</strong></div><div class="stars">${ss}</div>`;box.append(el)});box.querySelectorAll('.star').forEach(b=>b.onclick=()=>toggleStar(b.dataset.id,b.dataset.date))}
function toggleStar(id,date){const idx=stars.findIndex(s=>s.participant_id===id&&s.date===date);if(idx>=0)stars[idx].points=stars[idx].points?0:1;else stars.push({participant_id:id,date,points:1});renderScores()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');load();
</script></body></html>
