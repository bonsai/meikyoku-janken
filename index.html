<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dcefdc"><link rel="manifest" href="./manifest.webmanifest">
<title>aki — 名曲じゃんけん</title>
<style>
:root{--pink:#f7dce8;--pink2:#fff0f5;--green:#dcefdc;--green2:#f2faf2;--ink:#405046;--line:#cbdcca}*{box-sizing:border-box}html,body{margin:0;min-height:100%;color:var(--ink);font-family:ui-rounded,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;background:var(--pink2)}body{background-image:radial-gradient(circle at 15% 20%,#fff9 0 28px,transparent 29px),radial-gradient(circle at 80% 12%,#dcefdc88 0 34px,transparent 35px),radial-gradient(circle at 60% 78%,#f7dce888 0 42px,transparent 43px);background-size:180px 180px,230px 230px,260px 260px}header{text-align:center;padding:30px 16px 16px}h1{margin:0;font-size:clamp(42px,8vw,68px);font-weight:400;letter-spacing:.08em;color:#718875}header p{margin:6px 0;color:#a77d91;font-size:13px}.wrap{max-width:1100px;margin:auto;padding:8px 14px 60px}.belt{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:34px calc(50% - 110px) 42px;scrollbar-width:none;overscroll-behavior-x:contain}.belt::-webkit-scrollbar{display:none}.day{flex:0 0 220px;min-height:220px;scroll-snap-align:center;border:1px solid var(--line);border-radius:28px;background:#fffefee8;padding:18px;transform:scale(.68);opacity:.4;transition:transform .28s,opacity .28s,box-shadow .28s}.day.active{transform:scale(1.08);opacity:1;box-shadow:0 16px 40px #7188752b}.day.near{transform:scale(.84);opacity:.72}.day.future{background:#f4fbf4}.day.past{background:#fff4f8}.num{font-size:12px;color:#8b9b8e}.date{font-size:25px;margin:5px 0}.theme{font-size:16px}.winner{margin-top:16px;color:#a16f88}.badge{display:inline-block;margin-top:12px;padding:5px 10px;border-radius:99px;background:var(--green);font-size:11px}.panel{background:#ffffffc9;border:1px solid var(--line);border-radius:24px;padding:18px;margin:12px 0;backdrop-filter:blur(5px)}h2{font-size:18px;font-weight:500;margin:0 0 14px}.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.person{border:1px solid #d9e5d8;border-radius:18px;padding:12px;background:var(--green2)}.person:nth-child(3n){background:var(--pink2)}.top{display:flex;justify-content:space-between;align-items:center}.name{font-size:14px}.total{font-size:22px}.stars{display:flex;gap:2px;margin-top:7px;flex-wrap:wrap}.star{border:0;background:none;font-size:21px;line-height:1;padding:1px;cursor:pointer;opacity:.25}.star.on{opacity:1}.hint{text-align:center;font-size:11px;color:#9b8b92;margin-top:10px}.daynum{font-size:11px;color:#9b7b89}@media(max-width:600px){.belt{padding-left:calc(50% - 105px);padding-right:calc(50% - 105px)}.day{flex-basis:210px;min-height:205px}.panel{padding:14px}}
</style></head>
<body><header><h1>aki</h1><p>9.13 — 9.27　15日間</p></header>
<main class="wrap"><section><div class="belt" id="belt"></div><div class="hint">← 15日間の帯をスワイプ →</div></section><section class="panel"><h2>累計 ★</h2><div class="score" id="score"></div><div class="hint">★を押すと得点。途中参加も参加日から表示します。</div></section></main>
<script>
const DAYURL='./data/days.csv',PARTURL='./data/participants.csv',STARURL='./data/stars.csv';let days=[],parts=[],stars=[];let today=new Date('2026-09-15T00:00:00+09:00');
function localDate(s){return new Date(s+'T00:00:00+09:00')}
function csv(t){const lines=t.trim().split(/\r?\n/);const keys=lines.shift().split(',');return lines.map(l=>{const v=l.split(',');return Object.fromEntries(keys.map((k,i)=>[k,v[i]??'']))})}
async function load(){const [d,p,s]=await Promise.all([fetch(DAYURL).then(r=>r.text()),fetch(PARTURL).then(r=>r.text()),fetch(STARURL).then(r=>r.text())]);days=csv(d);parts=csv(p);stars=csv(s).map(x=>({...x,points:+x.points}));render()}
function activeIndex(){return Math.max(0,Math.min(days.length-1,Math.round((today-localDate('2026-09-13'))/86400000)))}
function render(){const belt=document.querySelector('#belt');belt.innerHTML='';days.forEach((d,i)=>{const e=document.createElement('article');e.className='day '+(i===activeIndex()?'active':Math.abs(i-activeIndex())===1?'near':i<activeIndex()?'past':'future');e.dataset.i=i;e.innerHTML=`<div class="daynum">DAY ${d.day}</div><div class="num">${d.date.slice(5).replace('-','.')}</div><div class="date">${localDate(d.date).toLocaleDateString('ja-JP',{weekday:'short'})}</div><div class="theme">${d.theme||'テーマ未定'}</div><div class="winner">${d.winner?'★ '+d.winner:'勝者未定'}</div>${i===activeIndex()?'<span class="badge">TODAY</span>':''}`;belt.append(e)});setupBelt();renderScores()}
function setupBelt(){const belt=document.querySelector('#belt');const cards=[...belt.children];const focus=()=>{const mid=belt.scrollLeft+belt.clientWidth/2;let best=0,dist=Infinity;cards.forEach((c,i)=>{const x=c.offsetLeft+c.offsetWidth/2,d=Math.abs(x-mid);if(d<dist){dist=d;best=i}});cards.forEach((c,i)=>{c.classList.toggle('active',i===best);c.classList.toggle('near',Math.abs(i-best)===1);if(Math.abs(i-best)>1)c.classList.remove('near');c.classList.toggle('past',i<best);c.classList.toggle('future',i>best)})};belt.addEventListener('scroll',()=>requestAnimationFrame(focus),{passive:true});setTimeout(()=>cards[activeIndex()]?.scrollIntoView({behavior:'instant',inline:'center'}),30)}
function renderScores(){const box=document.querySelector('#score');box.innerHTML='';const totals=parts.map(p=>{const mine=stars.filter(s=>s.participant_id===p.id&&s.points>0);return {...p,total:mine.reduce((a,s)=>a+s.points,0)}}).sort((a,b)=>b.total-a.total);totals.forEach(p=>{const el=document.createElement('div');el.className='person';const ss=days.map(d=>{const ok=localDate(d.date)>=localDate(p.joined)&&stars.some(s=>s.date===d.date&&s.participant_id===p.id&&s.points>0);return `<button class="star ${ok?'on':''}" data-id="${p.id}" data-date="${d.date}">★</button>`}).join('');el.innerHTML=`<div class="top"><span class="name">${p.name}</span><strong class="total">${p.total}点</strong></div><div class="stars">${ss}</div>`;box.append(el)});box.querySelectorAll('.star').forEach(b=>b.onclick=()=>toggleStar(b.dataset.id,b.dataset.date))}
function toggleStar(id,date){const idx=stars.findIndex(s=>s.participant_id===id&&s.date===date);if(idx>=0)stars[idx].points=stars[idx].points?0:1;else stars.push({participant_id:id,date,points:1});renderScores()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');load();
</script></body></html>
