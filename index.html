<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d8793a"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css">
<title>名曲じゃんけん秋場所</title>
</head>
<body>
<header><h1>名曲じゃんけん秋場所</h1><p>9.13 — 9.27　十五日間</p><button id="editOpen" class="edit-open">編集</button></header>
<main class="wrap"><section><div class="belt" id="belt"></div><div class="hint">← めくる →</div></section><section class="panel"><h2>累計 ★</h2><div class="score" id="score"></div><div class="hint">★を押して得点</div></section></main>
<div class="editor" id="editor" hidden>
  <div class="editor-box">
    <button id="editClose" class="close">×</button>
    <h2>編集</h2>
    <div id="login"><p>編集パスワード</p><input id="password" type="password" autocomplete="off" placeholder="pass"><button id="loginBtn">開く</button><p id="loginError" class="error"></p></div>
    <div id="editForm" hidden>
      <h3>十五日間</h3><div id="dayEdit"></div>
      <h3>参加者</h3><div id="participantEdit"></div>
      <div class="editor-actions"><button id="saveLocal">保存</button><button id="exportDays">days.csv</button><button id="exportParticipants">participants.csv</button><button id="exportStars">stars.csv</button></div>
      <p class="editor-note">保存はこの端末のブラウザに反映します。GitHub上のCSVを直接変更する機能ではありません。</p>
    </div>
  </div>
</div>
<script src="./app.js"></script>
</body></html>
